<!DOCTYPE html><html class="dark" lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

</head><body class="bg-black font-body-md text-body-md text-[#ECE0DA] pt-safe pb-safe flex flex-col min-h-screen"><main class="flex flex-col relative w-full bg-black min-h-screen px-margin justify-center py-4"><div class="flex flex-col w-full relative">
<!-- Backdrop Simulator for context feel within pure black shell -->
<div class="fixed inset-0 bg-black pointer-events-none -z-10"></div>
<!-- Modal Container Card (Pure Dark AMOLED #171412 with subtle outline #2E2824) -->
<div class="w-full max-w-lg mx-auto bg-[#171412] border border-[#2E2824] rounded-[24px] shadow-2xl p-6 sm:p-8 flex flex-col gap-6 relative overflow-hidden transition-all duration-300">
<!-- Warm Ambient Radial Glow Header Highlight -->
<div class="absolute -top-16 -right-16 w-44 h-44 rounded-full bg-[#FFB77C]/10 blur-2xl pointer-events-none"></div>
<!-- Header Section -->
<div class="flex items-start gap-4 relative">
<div class="w-12 h-12 rounded-2xl bg-[#25211D] border border-[#2E2824] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[#FFB77C] text-2xl" style="font-variation-settings: 'FILL' 1;">add_location_alt</span>
</div>
<div class="flex flex-col gap-1 min-w-0 pr-6">
<h2 class="font-title-lg text-title-lg text-[#ECE0DA] tracking-tight truncate">
          Nueva Zona de Almacén
        </h2>
<p class="font-body-md text-body-md text-[#A89F97] leading-snug">
          Organiza y agrupa tus cajas en un espacio físico identificable.
        </p>
</div>
<!-- Close Quick Action -->
<button aria-label="Cerrar diálogo" class="absolute top-0 right-0 w-8 h-8 rounded-full bg-[#25211D] border border-[#2E2824] flex items-center justify-center text-[#A89F97] hover:text-[#ECE0DA] active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-lg">close</span>
</button>
</div>
<!-- Form Body -->
<form class="flex flex-col gap-5 w-full" onsubmit="event.preventDefault();">
<!-- Input 1: Floating Label Style - Zone Name -->
<div class="relative w-full rounded-2xl bg-[#25211D] border border-[#2E2824] p-3.5 flex flex-col focus-within:border-[#FFB77C]/50 transition-colors">
<label class="font-label-sm text-label-sm text-[#FFB77C] uppercase tracking-wider font-semibold" for="zone-name">
          Nombre de la Zona
        </label>
<input class="bg-transparent border-0 outline-none text-[#ECE0DA] font-body-lg text-body-lg placeholder:text-[#A89F97]/60 pt-1 w-full" id="zone-name" placeholder="ej. Desván, Garaje, Taller Exterior" type="text" value="Desván Principal">
<!-- Active indicator warm line -->
<div class="absolute bottom-0 left-3.5 right-3.5 h-[2px] bg-[#FFB77C] rounded-full"></div>
</div>
<!-- Icon Selector Carousel / Grid -->
<div class="flex flex-col gap-2.5">
<div class="flex items-center justify-between">
<span class="font-label-lg text-label-lg text-[#ECE0DA]">Icono representativo</span>
<span class="font-label-sm text-label-sm text-[#A89F97]">Taller seleccionado</span>
</div>
<div class="flex items-center gap-2.5 overflow-x-auto pb-1 pt-0.5 no-scrollbar scroll-smooth">
<!-- Icon 1 -->
<button class="shrink-0 w-12 h-12 rounded-xl flex items-center justify-center bg-[#25211D] border border-[#2E2824] text-[#A89F97] hover:text-[#ECE0DA] hover:border-[#3d352f] transition-all" type="button">
<span class="material-symbols-outlined text-xl">bed</span>
</button>
<!-- Icon 2: Active with halo -->
<button class="shrink-0 w-12 h-12 rounded-xl flex items-center justify-center bg-[#FFB77C] text-[#4D2700] shadow-md shadow-[#FFB77C]/20 transition-transform scale-105" type="button">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">handyman</span>
</button>
<!-- Icon 3 -->
<button class="shrink-0 w-12 h-12 rounded-xl flex items-center justify-center bg-[#25211D] border border-[#2E2824] text-[#A89F97] hover:text-[#ECE0DA] hover:border-[#3d352f] transition-all" type="button">
<span class="material-symbols-outlined text-xl">chair</span>
</button>
<!-- Icon 4 -->
<button class="shrink-0 w-12 h-12 rounded-xl flex items-center justify-center bg-[#25211D] border border-[#2E2824] text-[#A89F97] hover:text-[#ECE0DA] hover:border-[#3d352f] transition-all" type="button">
<span class="material-symbols-outlined text-xl">luggage</span>
</button>
<!-- Icon 5 -->
<button class="shrink-0 w-12 h-12 rounded-xl flex items-center justify-center bg-[#25211D] border border-[#2E2824] text-[#A89F97] hover:text-[#ECE0DA] hover:border-[#3d352f] transition-all" type="button">
<span class="material-symbols-outlined text-xl">roofing</span>
</button>
<!-- Icon 6 -->
<button class="shrink-0 w-12 h-12 rounded-xl flex items-center justify-center bg-[#25211D] border border-[#2E2824] text-[#A89F97] hover:text-[#ECE0DA] hover:border-[#3d352f] transition-all" type="button">
<span class="material-symbols-outlined text-xl">checkroom</span>
</button>
<!-- Icon 7 -->
<button class="shrink-0 w-12 h-12 rounded-xl flex items-center justify-center bg-[#25211D] border border-[#2E2824] text-[#A89F97] hover:text-[#ECE0DA] hover:border-[#3d352f] transition-all" type="button">
<span class="material-symbols-outlined text-xl">warehouse</span>
</button>
</div>
</div>
<!-- Color Accent Semantic Selector -->
<div class="flex flex-col gap-2.5">
<span class="font-label-lg text-label-lg text-[#ECE0DA]">Distintivo cromático</span>
<div class="flex items-center justify-between p-2 rounded-2xl bg-[#25211D] border border-[#2E2824]">
<!-- Ámbar (Selected with inner tick) -->
<button aria-label="Color Ámbar" class="w-9 h-9 rounded-full bg-[#F59E0B] flex items-center justify-center shadow-lg transition-transform scale-110 ring-2 ring-[#FFB77C]" type="button">
<span class="material-symbols-outlined text-[#211A16] text-base font-bold">check</span>
</button>
<!-- Azul Tecno -->
<button aria-label="Color Azul" class="w-8 h-8 rounded-full bg-[#3B82F6] hover:scale-105 transition-transform" type="button"></button>
<!-- Verde Jardín -->
<button aria-label="Color Verde" class="w-8 h-8 rounded-full bg-[#10B981] hover:scale-105 transition-transform" type="button"></button>
<!-- Púrpura Archivo -->
<button aria-label="Color Púrpura" class="w-8 h-8 rounded-full bg-[#8B5CF6] hover:scale-105 transition-transform" type="button"></button>
<!-- Terracota -->
<button aria-label="Color Terracota" class="w-8 h-8 rounded-full bg-[#8c473b] hover:scale-105 transition-transform" type="button"></button>
<!-- Slate -->
<button aria-label="Color Pizarra" class="w-8 h-8 rounded-full bg-[#64748B] hover:scale-105 transition-transform" type="button"></button>
</div>
</div>
<!-- Input 2: Optional Description -->
<div class="relative w-full rounded-2xl bg-[#25211D] border border-[#2E2824] p-3.5 flex flex-col focus-within:border-[#FFB77C]/50 transition-colors">
<label class="font-label-sm text-label-sm text-[#A89F97] uppercase tracking-wider font-semibold" for="zone-desc">
          Descripción o Ubicación (Opcional)
        </label>
<input class="bg-transparent border-0 outline-none text-[#ECE0DA] font-body-md text-body-md placeholder:text-[#A89F97]/60 pt-1 w-full" id="zone-desc" placeholder="ej. Escalera este, módulo 3 junto a la viga" type="text">
</div>
<!-- Interactive Preview Pill Card -->
<div class="flex items-center gap-3 p-3.5 rounded-xl bg-[#25211D] border border-[#2E2824]">
<div class="w-8 h-8 rounded-lg bg-[#F59E0B]/20 border border-[#F59E0B]/30 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[#FFB77C] text-lg" style="font-variation-settings: 'FILL' 1;">handyman</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-sm text-label-sm text-[#A89F97]">Vista previa de etiqueta</span>
<span class="font-title-md text-title-md text-[#ECE0DA] truncate">Desván Principal • 0 Cajas</span>
</div>
<span class="material-symbols-outlined text-[#A89F97] ml-auto text-base">qr_code_2</span>
</div>
<!-- Footer Actions -->
<div class="flex items-center gap-3 pt-3 mt-1">
<!-- Cancel button -->
<button class="flex-1 h-12 rounded-2xl bg-[#2E2A27] border border-[#3d352f] hover:bg-[#38332f] active:scale-95 transition-all flex items-center justify-center font-label-lg text-label-lg text-[#ECE0DA]" type="button">
          Cancelar
        </button>
<!-- Save button with high-contrast Amber 80 (#FFB77C) and Dark Roast text (#4D2700) -->
<button class="h-12 rounded-2xl bg-[#FFB77C] hover:bg-[#ffbfa0] active:scale-95 transition-all flex items-center justify-center gap-2 font-title-md text-title-md text-[#4D2700] font-semibold shadow-md shadow-[#FFB77C]/20" style="flex: 2 1 0%;" type="submit">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">check</span>
<span class="">Guardar Zona</span>
</button>
</div>
</form>
</div>
</div></main>

</body></html>
