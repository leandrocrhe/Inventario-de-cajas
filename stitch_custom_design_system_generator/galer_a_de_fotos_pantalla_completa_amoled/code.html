<script>
  (() => {
    let currentIndex = 0;
    const thumbs = document.querySelectorAll('.thumb-btn');
    const counterEl = document.getElementById('gallery-counter');
    const badgeEl = document.getElementById('badge-title');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const mainImg = document.getElementById('main-view-image');
    const coverBtn = document.getElementById('set-cover-btn');
    const toast = document.getElementById('toast-indicator');

    const updateGallery = (newIdx) => {
      currentIndex = (newIdx + thumbs.length) % thumbs.length;
      counterEl.textContent = `${currentIndex + 1} de ${thumbs.length}`;

      thumbs.forEach((t, i) => {
        if (i === currentIndex) {
          t.classList.add('scale-105');
          t.classList.remove('opacity-60');
          t.style.boxShadow = '0 0 0 2.5px #FFB77D';
          const badgeText = t.getAttribute('data-badge');
          if (badgeEl && badgeText) badgeEl.textContent = badgeText;
          const thumbImg = t.querySelector('img');
          if (thumbImg && mainImg) {
            mainImg.src = thumbImg.src;
            mainImg.setAttribute('data-alt', thumbImg.getAttribute('data-alt') || '');
            mainImg.alt = thumbImg.alt;
          }
        } else {
          t.classList.remove('scale-105');
          t.classList.add('opacity-60');
          t.style.boxShadow = 'none';
        }
      });
    };

    thumbs.forEach((t, i) => {
      t.addEventListener('click', () => updateGallery(i));
    });

    if (prevBtn) {
      prevBtn.addEventListener('click', () => updateGallery(currentIndex - 1));
    }
    if (nextBtn) {
      nextBtn.addEventListener('click', () => updateGallery(currentIndex + 1));
    }

    if (coverBtn && toast) {
      coverBtn.addEventListener('click', () => {
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 2600);
      });
    }

    // Touch Swipe simulation
    let touchStartX = 0;
    const viewer = document.getElementById('image-viewer-container');
    if (viewer) {
      viewer.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      viewer.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        const diff = touchEndX - touchStartX;
        if (Math.abs(diff) > 40) {
          if (diff < 0) updateGallery(currentIndex + 1);
          else updateGallery(currentIndex - 1);
        }
      }, { passive: true });
    }
  })();
